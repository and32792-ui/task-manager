name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}/task-manager-api
  SPARK_IMAGE_NAME: ${{ github.repository }}/task-manager-spark

jobs:
  # ─── Lint and Test ────────────────────────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

  # ─── Build API Docker Image ───────────────────────────────────────────────
  build-api:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Build Spark Docker Image ─────────────────────────────────────────────
  build-spark:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SPARK_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Spark image
        uses: docker/build-push-action@v5
        with:
          context: ./spark-jobs
          file: ./spark-jobs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Kubernetes (main branch only) ──────────────────────────────
  deploy:
    needs: [build-api, build-spark]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          # Apply namespaces
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/ozone-namespace.yaml
          kubectl apply -f infra/k8s/spark-namespace.yaml
          kubectl apply -f infra/k8s/airflow-namespace.yaml
          kubectl apply -f infra/k8s/monitoring-namespace.yaml

          # Apply secrets (from GitHub Secrets)
          kubectl create secret generic task-manager-secrets \
            --from-literal=PG_USER=taskmanager \
            --from-literal=PG_PASSWORD=${{ secrets.PG_PASSWORD }} \
            -n task-manager --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic ozone-credentials \
            --from-literal=access-key=${{ secrets.OZONE_ACCESS_KEY }} \
            --from-literal=secret-key=${{ secrets.OZONE_SECRET_KEY }} \
            -n task-manager --dry-run=client -o yaml | kubectl apply -f -

          # Deploy PostgreSQL
          kubectl apply -f infra/k8s/postgres-statefulset.yaml

          # Wait for PostgreSQL to be ready
          kubectl rollout status statefulset/postgres -n task-manager --timeout=300s

          # Run migrations
          kubectl run migrations \
            --image=${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }} \
            --restart=Never \
            --rm -i --tty \
            --env PG_HOST=postgres.task-manager.svc.cluster.local \
            --env PG_PASSWORD=${{ secrets.PG_PASSWORD }} \
            -- npm run migrate

          # Deploy API
          kubectl apply -f infra/k8s/api-deployment.yaml
          kubectl rollout status deployment/task-manager-api -n task-manager --timeout=300s

          # Deploy Spark jobs
          kubectl apply -f infra/k8s/spark-streaming-job.yaml
          kubectl apply -f infra/k8s/spark-batch-jobs.yaml

          # Deploy Airflow
          kubectl apply -f infra/k8s/airflow-namespace.yaml

          # Deploy monitoring
          kubectl apply -f infra/k8s/servicemonitors.yaml
          kubectl apply -f infra/k8s/grafana-dashboard.yaml

          # Deploy security
          kubectl apply -f infra/k8s/cert-manager.yaml
          kubectl apply -f infra/k8s/network-policies.yaml

      - name: Verify deployment
        run: |
          kubectl get pods -n task-manager
          kubectl get pods -n spark
          kubectl get services -n task-manager

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: spark
data:
  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:postgresql://postgres.task-manager.svc.cluster.local:5432/hive_metastore</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>taskmanager</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionPassword</name>
        <value>CHANGE_ME</value>
      </property>
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://taskmanager.curated-data/warehouse</value>
      </property>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://ozone-s3g.ozone.svc.cluster.local:9878</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>CHANGE_ME</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>CHANGE_ME</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://hive-metastore.spark.svc.cluster.local:9083</value>
      </property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      containers:
        - name: metastore
          image: apache/hive:3.1.3
          command: ["/opt/hive/bin/hive", "--service", "metastore"]
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: hive-config
          configMap:
            name: hive-metastore-config
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: spark
spec:
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      targetPort: 9083
  type: ClusterIP

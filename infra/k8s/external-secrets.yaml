# External Secrets Operator configuration
# Install: helm install external-secrets external-secrets/external-secrets -n external-secrets

# For production, use a real secret backend like:
# - AWS Secrets Manager
# - HashiCorp Vault
# - Azure Key Vault
# - GCP Secret Manager

# This example uses a simple Kubernetes Secret as the backend for POC

---
# SecretStore - defines where to fetch secrets from
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: kubernetes-secret-store
  namespace: task-manager
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-sa
---
# ExternalSecret for Task Manager API
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: task-manager-secrets-sync
  namespace: task-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-secret-store
    kind: SecretStore
  target:
    name: task-manager-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: task-manager-db-credentials
        property: password
    - secretKey: OZONE_ACCESS_KEY
      remoteRef:
        key: ozone-credentials
        property: access-key
    - secretKey: OZONE_SECRET_KEY
      remoteRef:
        key: ozone-credentials
        property: secret-key
---
# ExternalSecret for Spark
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spark-secrets-sync
  namespace: spark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-secret-store
    kind: SecretStore
  target:
    name: ozone-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: ozone-credentials
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: ozone-credentials
        property: secret-key
---
# Source secrets (in production, these would be in Vault/Secrets Manager)
# These are the actual secret values - in production, use sealed-secrets or external vault
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-db-credentials
  namespace: task-manager
type: Opaque
stringData:
  password: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: ozone-credentials
  namespace: task-manager
type: Opaque
stringData:
  access-key: "taskmanager-ozone-access"
  secret-key: "CHANGE_ME_IN_PRODUCTION"
